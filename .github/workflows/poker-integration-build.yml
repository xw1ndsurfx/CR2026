name: Poker event integration builds
on:
  push:
    branches: ['feature/poker-minigame-core']
    paths:
      - 'Framework/Intersect.Framework.Core/GameObjects/Events/**'
      - 'Intersect.Server.Core/MiniGames/**'
      - 'Intersect.Server.Core/Entities/*MiniGames.cs'
      - 'Intersect.Server.Core/Entities/Events/*MiniGames.cs'
      - 'Intersect.Editor/Forms/Editors/Events/**'
      - '.github/workflows/poker-integration-build.yml'
  pull_request:
    paths:
      - 'Framework/Intersect.Framework.Core/GameObjects/Events/**'
      - 'Intersect.Server.Core/MiniGames/**'
      - 'Intersect.Server.Core/Entities/*MiniGames.cs'
      - 'Intersect.Server.Core/Entities/Events/*MiniGames.cs'
      - 'Intersect.Editor/Forms/Editors/Events/**'
      - '.github/workflows/poker-integration-build.yml'
permissions:
  contents: read
jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server-core
            project: Intersect.Server.Core/Intersect.Server.Core.csproj
          - target: editor
            project: Intersect.Editor/Intersect.Editor.csproj
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile actual engine project and dependencies
        run: dotnet build "${{ matrix.project }}" --configuration Debug --nologo
