name: Fishing profession
on:
  pull_request:
    paths:
      - 'Framework/Intersect.Framework.Core/Fishing/**'
      - 'Framework/Intersect.Framework.Core/Network/Packets/**/Fishing*'
      - 'Framework/Intersect.Framework.Core/GameObjects/Events/**'
      - 'Intersect.Server.Core/Fishing/**'
      - 'Intersect.Server.Core/**/Player.Fishing.cs'
      - 'Intersect.Server.Core/**/PacketHandler.Fishing.cs'
      - 'Intersect.Server.Core/**/CommandProcessing.Fishing.cs'
      - 'Intersect.Client.Core/**/*Fishing*.cs'
      - 'Intersect.Client.Core/Entities/Player.cs'
      - 'Intersect.Tests.Client/Fishing*Tests.cs'
      - 'Intersect.Editor/**/*Fishing*'
      - 'Intersect.Editor/Forms/EditorHub/**'
      - 'Intersect.Editor/Forms/frmMain.EditorHub.cs'
      - 'Intersect.Editor/Forms/frmMain.cs'
      - 'Intersect.Editor/Resources/EditorHub/**'
      - 'Shared/FishingAssets.props'
      - 'resources/fishing/**'
      - 'resources/sounds/fishing/**'
      - 'Utilities/FishingRulesTests/**'
      - 'Utilities/InterfaceEditorTests/FishingEditorTests.cs'
      - 'Utilities/InterfaceEditorTests/EditorHubTests.cs'
      - 'scripts/fishing/**'
      - 'scripts/Verify-Fishing.ps1'
      - '.github/workflows/fishing.yml'
  workflow_dispatch:
jobs:
  native-fishing:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset verification dependency
        run: python -m pip install Pillow
      - name: Build server, client and editor; verify rules, rewards, controls and assets
        shell: pwsh
        run: ./scripts/Verify-Fishing.ps1
