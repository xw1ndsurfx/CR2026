name: Advanced combat phase 3
on:
  pull_request:
    paths:
      - 'Framework/Intersect.Framework.Core/GameObjects/Combat/**'
      - 'Framework/Intersect.Framework.Core/Network/Packets/Server/AdvancedCombatStatePacket.cs'
      - 'Framework/Intersect.Framework.Core/Network/Packets/Server/CombatTelegraphPacket.cs'
      - 'Framework/Intersect.Framework.Core/Config/CombatOptions.cs'
      - 'Intersect.Client.Core/Interface/Game/AdvancedCombat*'
      - 'Intersect.Client.Core/Interface/Game/GameInterface.AdvancedCombat.cs'
      - 'Intersect.Client.Core/Networking/PacketHandler.AdvancedCombat.cs'
      - 'Intersect.Server.Core/Entities/*AdvancedCombat.cs'
      - 'Intersect.Tests/Utilities/AdvancedCombat*'
      - '.github/workflows/advanced-combat-phase3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Endurance and boss phase rules
        run: dotnet test Intersect.Tests/Intersect.Tests.csproj -c Debug --filter "FullyQualifiedName~AdvancedCombatStaminaTests|FullyQualifiedName~AdvancedCombatBossPhaseTests|FullyQualifiedName~AdvancedCombatGeometryTests" --nologo
      - name: Build server, client and NPC editor
        shell: pwsh
        run: |
          dotnet build Intersect.Server/Intersect.Server.csproj -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Intersect.Client/Intersect.Client.csproj -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Intersect.Editor/Intersect.Editor.csproj -c Debug -p:RuntimeIdentifiers=win-x64 --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
