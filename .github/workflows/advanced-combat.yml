name: Advanced combat telegraph geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'Framework/Intersect.Framework.Core/GameObjects/NPCs/CombatTelegraphGeometry.cs'
      - 'Framework/Intersect.Framework.Core/GameObjects/NPCs/NPCDescriptor.cs'
      - 'Framework/Intersect.Framework.Core/Network/Packets/Server/CombatTelegraphPacket.cs'
      - 'Intersect.Server.Core/Entities/Npc.AdvancedCombat.cs'
      - 'Intersect.Server.Core/Entities/Npc.cs'
      - 'Intersect.Client.Core/Core/Graphics.AdvancedCombat.cs'
      - 'Intersect.Editor/Forms/Editors/frmNpc*'
      - 'Intersect.Tests/Utilities/AdvancedCombatGeometryTests.cs'
      - '.github/workflows/advanced-combat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patterns:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Shared warning geometry tests
        run: dotnet test Intersect.Tests/Intersect.Tests.csproj -c Debug --filter "FullyQualifiedName~AdvancedCombatGeometryTests" --nologo
      - name: Build server, client and NPC editor
        run: |
          dotnet build Intersect.Server/Intersect.Server.csproj -c Debug --nologo
          dotnet build Intersect.Client/Intersect.Client.csproj -c Debug --nologo
          dotnet build Intersect.Editor/Intersect.Editor.csproj -c Debug -p:RuntimeIdentifiers=win-x64 --nologo
