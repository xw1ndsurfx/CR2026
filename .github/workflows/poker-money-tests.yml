name: Poker inventory escrow tests
on:
  push:
    branches: ['feature/poker-minigame-core']
  pull_request:
    paths:
      - 'Intersect.Server.Core/MiniGames/**'
      - 'Intersect.Server.Core/Database/PlayerData/User.Poker.cs'
      - 'Intersect.Server.Core/Entities/Player.PokerCurrency.cs'
      - 'Utilities/PokerMoneyTests/**'
      - 'Utilities/PokerInventoryTests/**'
      - '.github/workflows/poker-money-tests.yml'
permissions:
  contents: read
concurrency:
  group: poker-money-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  money:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Atomic escrow, restart and funded tables
        shell: pwsh
        run: ./Utilities/PokerCi/run.ps1 -Project Utilities/PokerMoneyTests/Intersect.PokerMoneyTests.csproj -Configuration Release
  inventory:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Actual PlayerContext and InventorySlot transaction checks
        shell: pwsh
        run: ./Utilities/PokerCi/run.ps1 -Project Utilities/PokerInventoryTests/Intersect.PokerInventoryTests.csproj -Configuration Release
