name: Naval phase 1 tests
on:
  pull_request:
    paths:
      - 'Framework/Intersect.Framework.Core/Naval/**'
      - 'Framework/Intersect.Framework.Core/Configuration/**'
      - 'Framework/Intersect.Framework.Core/GameObjects/Maps/**'
      - 'Intersect.Tests.Server/ClientConfigurationSafetyTests.cs'
      - 'Intersect.Tests.Client/HarbourUiRulesTests.cs'
      - 'Intersect.Editor/Forms/Editors/FrmNavalConfiguration*.cs'
      - 'Intersect.Editor/Forms/frmMain.Naval.cs'
      - 'Utilities/InterfaceEditorTests/NavalSystemEditorTests.cs'
      - 'Framework/Intersect.Framework.Core/GameObjects/Events/Commands/OpenNavalShopCommand.cs'
      - 'Intersect.Tests.Client/ClientLoopDiagnosticsTests.cs'
      - 'Intersect.Tests.Client/ClientNetworkPingTests.cs'
      - 'Intersect.Network/ClientNetwork.cs'
      - 'Intersect.Network/Intersect.Network.csproj'
      - 'Intersect.Client.Core/Core/ClientLoopDiagnostics.cs'
      - 'Intersect.Client.Framework/Gwen/Control/Canvas.cs'
      - 'Intersect.Client.Framework/Gwen/Control/ScrollControl.cs'
      - 'Intersect.Editor/Forms/Editors/FrmMenuAnimations.cs'
      - 'Utilities/InterfaceEditorTests/MenuAnimationEditorTests.cs'
      - 'Utilities/InterfaceEditorTests/AchievementRewardEditorTests.cs'
      - 'Intersect.Editor/Forms/Editors/AchievementRewardItemSelector.cs'
      - 'Intersect.Editor/Forms/Editors/FrmAchievementConfiguration.cs'
      - 'Intersect.Client.Core/Interface/Menu/MenuGuiBase.cs'
      - 'Utilities/InterfaceEditorTests/HarbourDockEditorTests.cs'
      - 'Framework/Intersect.Framework.Core/Network/Packets/Editor/PrepareNavalMapPacket.cs'
      - 'Framework/Intersect.Framework.Core/Network/Packets/Server/NavalSetupResultPacket.cs'
      - 'Framework/Intersect.Framework.Core/Network/Packets/EditorPacket.cs'
      - 'Framework/Intersect.Framework.Core/Network/Packets/Client/ShipInputPacket.cs'
      - 'Framework/Intersect.Framework.Core/Network/Packets/Server/NavalSnapshotPacket.cs'
      - 'Intersect.Server.Core/Naval/**'
      - 'Intersect.Server.Core/Entities/Player*'
      - 'Intersect.Server.Core/Networking/PacketHandler*'
      - 'Intersect.Tests.Server/Naval/**'
      - 'Intersect.Client.Core/Naval/**'
      - 'Intersect.Client.Core/Interface/Game/Hotbar/**'
      - 'Intersect.Client.Core/Entities/Entity.cs'
      - 'Intersect.Server.Core/Entities/Entity.cs'
      - 'Framework/Intersect.Framework.Core/Network/Packets/Client/ShipActionPacket.cs'
      - 'Intersect.Tests.Client/Naval*.cs'
      - 'resources/ocean/**'
      - 'Intersect.Client.Core/Localization/Locales/ui.json'
      - 'Intersect.Editor/Forms/DockingElements/frmMapList.cs'
      - 'Intersect.Editor/Networking/PacketHandler.Naval.cs'
      - 'Intersect.Editor/Localization/Strings.Naval.cs'
      - 'Utilities/InterfaceEditorTests/NavalMapListTests.cs'
      - '.github/workflows/naval-tests.yml'
  workflow_dispatch:
jobs:
  naval:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Intersect.Tests.Server/Intersect.Tests.Server.csproj -c Debug --filter "FullyQualifiedName~Intersect.Tests.Server.Naval|FullyQualifiedName~ClientConfigurationSafetyTests|FullyQualifiedName~InvasionSimulationTests" --nologo
      - run: dotnet test Intersect.Tests.Client/Intersect.Tests.Client.csproj -c Debug --filter "FullyQualifiedName~Naval|FullyQualifiedName~HarbourUiRulesTests|FullyQualifiedName~ClientLoopDiagnosticsTests|FullyQualifiedName~ClientNetworkPingTests" --nologo
      - run: dotnet run --project Utilities/InterfaceEditorTests/Intersect.InterfaceEditorTests.csproj -c Debug -p:RuntimeIdentifiers=win-x64 -- --naval-only
      - run: dotnet run --project Utilities/InterfaceEditorTests/Intersect.InterfaceEditorTests.csproj -c Debug -p:RuntimeIdentifiers=win-x64 --no-build -- --harbour-only

      - run: dotnet run --project Utilities/InterfaceEditorTests/Intersect.InterfaceEditorTests.csproj -c Debug -p:RuntimeIdentifiers=win-x64 --no-build -- --qol-only
      - run: dotnet run --project Utilities/InterfaceEditorTests/Intersect.InterfaceEditorTests.csproj -c Debug -p:RuntimeIdentifiers=win-x64 --no-build -- --theme-only
